<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Excel Sender Bot</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS to read Excel files in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">

    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Telegram Excel Sender Bot</h2>

        <!-- Form Section -->
        <div class="space-y-4">
            <!-- File Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Upload Excel File (.xlsx, .xls)</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <!-- Message Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Message Text</label>
                <textarea id="messageText" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Type your message here..."></textarea>
            </div>

            <!-- Optional Image Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Optional Photo</label>
                <input type="file" id="photoFile" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
            </div>

            <!-- Submit Button -->
            <button onclick="startSending()" id="sendBtn" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
                Start Sending Messages
            </button>
        </div>

        <!-- Logs / Status Section -->
        <div class="mt-8">
            <h3 class="text-lg font-semibold text-gray-700 mb-2">Live Status Logs:</h3>
            <div id="logContainer" class="bg-black text-green-400 font-mono text-xs p-4 rounded-md h-56 overflow-y-auto space-y-1">
                <p class="text-gray-500">// Waiting for input...</p>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        function logMessage(text, type = "info") {
            const container = document.getElementById('logContainer');
            const p = document.createElement('p');
            if (type === 'success') p.className = 'text-green-400';
            else if (type === 'error') p.className = 'text-red-400';
            else if (type === 'progress') p.className = 'text-yellow-300';
            else p.className = 'text-gray-300';
            
            p.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            container.appendChild(p);
            container.scrollTop = container.scrollHeight;
        }

        async function startSending() {
            const fileInput = document.getElementById('excelFile');
            const messageText = document.getElementById('messageText').value.trim();
            const photoInput = document.getElementById('photoFile');
            const sendBtn = document.getElementById('sendBtn');

            if (!fileInput.files.length) {
                alert("Please upload an Excel file first!");
                return;
            }

            if (!messageText && !photoInput.files.length) {
                alert("Please provide either a text message or a photo to send!");
                return;
            }

            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50', 'cursor-not-allowed');
            logMessage("Reading Excel file...");

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    const totalRows = rows.length;
                    logMessage(`Found ${totalRows} rows in Excel. Starting broadcast...`, 'progress');

                    for (let i = 0; i < totalRows; i++) {
                        const currentRowNum = i + 1;
                        const row = rows[i];
                        const botToken = row[0] ? String(row[0]).trim() : '';
                        const chatId = row[1] ? String(row[1]).trim() : '';

                        if (!botToken || !chatId) {
                            logMessage(`[Bot ${currentRowNum}/${totalRows}] Skipping: Missing token or chat ID.`, 'error');
                            continue;
                        }

                        logMessage(`[Bot ${currentRowNum}/${totalRows}] Processing chat ID: ${chatId}...`, 'progress');

                        // Send Photo if provided, else Send Text Message
                        if (photoInput.files.length > 0) {
                            await sendPhoto(botToken, chatId, photoInput.files[0], messageText, currentRowNum, totalRows);
                        } else {
                            await sendMessage(botToken, chatId, messageText, currentRowNum, totalRows);
                        }

                        // Delay of 1 second to avoid Telegram rate limits
                        await new Promise(resolve => setTimeout(resolve, 1000));
                    }

                    logMessage(`🎉 Finished processing all ${totalRows} rows successfully!`, "success");
                } catch (err) {
                    logMessage(`Error processing file: ${err.message}`, "error");
                } finally {
                    sendBtn.disabled = false;
                    sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            };

            reader.readAsArrayBuffer(file);
        }

        async function sendMessage(token, chatId, text, current, total) {
            const url = `https://api.telegram.org/bot${token}/sendMessage`;
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: text })
                });
                const result = await response.json();
                if (result.ok) {
                    logMessage(`[Bot ${current}/${total}] SUCCESS: Message sent to Chat ID ${chatId}`, 'success');
                } else {
                    logMessage(`[Bot ${current}/${total}] ERROR (Chat ${chatId}): ${result.description}`, 'error');
                }
            } catch (err) {
                logMessage(`[Bot ${current}/${total}] NETWORK ERROR: ${err.message}`, 'error');
            }
        }

        async function sendPhoto(token, chatId, photoFile, caption, current, total) {
            const url = `https://api.telegram.org/bot{token}/sendPhoto`;
            // Correcting URL interpolation template literal:
            const fixedUrl = `https://api.telegram.org/bot${token}/sendPhoto`;
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', photoFile);
            if (caption) formData.append('caption', caption);

            try {
                const response = await fetch(fixedUrl, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.ok) {
                    logMessage(`[Bot ${current}/${total}] SUCCESS: Photo sent to Chat ID ${chatId}`, 'success');
                } else {
                    logMessage(`[Bot ${current}/${total}] ERROR (Chat ${chatId}): ${result.description}`, 'error');
                }
            } catch (err) {
                logMessage(`[Bot ${current}/${total}] NETWORK ERROR: ${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
